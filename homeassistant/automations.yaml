- id: '1760773455715'
  alias: 猫-行为日报
  description: ''
  triggers:
  - trigger: time
    at: 00:00:00
  conditions: []
  actions:
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: 本日大暑喝水{{states.counter.he_shui.state}}次，拉粑粑{{states.counter.la_ba_ba.state}}次。
  - action: notify.mobile_app_universal
    metadata: {}
    data:
      message: 大暑本日喝水{{states.counter.he_shui.state}}次，拉粑粑{{states.counter.la_ba_ba.state}}次。
  - parallel:
    - sequence:
      - wait_for_trigger:
        - trigger: time
          at: 09:00:00
        continue_on_timeout: true
      - action: tts.edge_tts_say
        metadata: {}
        data:
          cache: false
          entity_id: media_player.atv_181
          message: 大暑昨天一共喝水{{states.counter.he_shui.state}}次，拉粑粑{{states.counter.la_ba_ba.state}}次。
    - sequence:
      - delay:
          hours: 0
          minutes: 0
          seconds: 1
          milliseconds: 0
      - action: counter.reset
        metadata: {}
        data: {}
        target:
          entity_id:
          - counter.he_shui
          - counter.la_ba_ba
          - counter.zao_fang_ci_wo
          - counter.zao_fang_zhu_wo
  mode: single
