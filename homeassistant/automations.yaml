- id: '1732371688674'
  alias: 加湿器提醒
  description: ''
  triggers:
  - trigger: time
    at: '19:30:00'
  - trigger: time
    at: '20:30:00'
  - trigger: time
    at: '21:30:00'
  - trigger: time
    at: '22:30:00'
